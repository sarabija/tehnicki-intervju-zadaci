<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Calorie Tracker App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #user-edit-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 9999;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth-section">
            <div id="login-form">
                <h2>Prijava</h2>
                <input type="text" id="username" placeholder="Korisničko ime"><br>
                <input type="password" id="password" placeholder="Lozinka"><br>
                <button onclick="login()">Prijavi se</button>
                <p>Nemaš nalog? <a href="#" onclick="toggleAuth()">Registruj se</a></p>
            </div>
            <div id="register-form" class="hidden">
                <h2>Registracija</h2>
                <input type="text" id="reg-username" placeholder="Korisničko ime"><br>
                <input type="password" id="reg-password" placeholder="Lozinka"><br>
                <input type="number" id="reg-calories" placeholder="Limit kalorija"><br>
                <button onclick="register()">Kreiraj nalog</button>
                <p><a href="#" onclick="toggleAuth()">Povratak na prijavu</a></p>
            </div>
        </div>

        <div id="app-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="welcome-msg"></h2>
                <button onclick="logout()" style="background:#ff4444; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">Odjava</button>
            </div>

            <nav style="margin: 20px 0; border-bottom: 2px solid #ddd; padding-bottom: 10px;">
                <button onclick="switchTab('meals-tab')" style="padding: 10px; cursor:pointer;">Pregled obroka</button>
                <button id="nav-users" class="hidden" onclick="switchTab('users-tab')" style="padding: 10px; cursor:pointer;">Korisnici</button>
            </nav>

            <div id="meals-tab" class="tab-content">
                <div id="admin-hide-this">
                    <div id="daily-status" style="padding: 20px; border-radius: 8px; text-align: center; margin: 20px 0; font-weight: bold; font-size: 1.3rem;"></div>
                   <div class="limit-box">
                        <strong>Dnevni limit:</strong> 
                        <input type="number" id="user-limit" value="2100"> kcal
                        <button onclick="updateLimit()" style="background: var(--secondary-color); color:white;">Sačuvaj</button>
                    </div>
                    <h3 id="form-title">Dodaj novi obrok</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px; background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 5px;">
                        <input type="hidden" id="meal-id">
                        <input type="text" id="meal-text" placeholder="Šta ste jeli?">
                        <input type="number" id="meal-calories" placeholder="Kcal">
                        <input type="date" id="meal-date">
                        <input type="time" id="meal-time">
                        <div style="display: flex; gap: 10px;">
                            <button id="btn-save" onclick="saveMeal()" style="flex: 2; background: #4CAF50; color: white; padding: 10px; border: none; border-radius: 3px; cursor: pointer;">Dodaj obrok</button>
                            <button id="btn-cancel" onclick="resetForm()" class="hidden" style="flex: 1; background: #888; color: white; border: none; border-radius: 3px; cursor: pointer;">Odustani</button>
                        </div>
                    </div>
                    <hr>
                </div>

                <h3>Istorija svih obroka</h3>
                <table>
                    <thead>
                        <tr><th>Datum</th><th>Vrijeme</th><th>Obrok</th><th>Kcal</th><th>Akcije</th></tr>
                    </thead>
                    <tbody id="meals-body"></tbody>
                </table>
            </div>

            <div id="users-tab" class="tab-content hidden">
                <h3>Upravljanje korisnicima</h3>
                <table style="width: 100%;">
                    <thead>
                        <tr><th>ID</th><th>Username</th><th>Uloga</th><th>Limit</th><th>Akcije</th></tr>
                    </thead>
                    <tbody id="users-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="user-edit-modal">
        <div style="background: white; padding: 20px; border-radius: 10px; width: 300px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
            <h3>Uredi korisnika</h3>
            <input type="hidden" id="edit-user-id">
            <label>Uloga:</label><br>
            <select id="edit-user-role" style="width:100%; padding:5px; margin: 10px 0;">
                <option value="user">User</option>
                <option value="manager">Manager</option>
                <option value="admin">Admin</option>
            </select><br>
            <label>Dnevni limit:</label><br>
            <input type="number" id="edit-user-limit" style="width:95%; padding:5px; margin: 10px 0;"><br><br>
            <button onclick="saveUserChanges()" style="background:green; color:white; padding:10px; border:none; cursor:pointer;">Sačuvaj</button>
            <button onclick="closeUserModal()" style="background:gray; color:white; padding:10px; border:none; cursor:pointer;">Zatvori</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
